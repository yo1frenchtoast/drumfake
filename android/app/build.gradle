plugins {
    id 'com.android.application'
}

android {
    namespace = "org.drumfake.app"
    compileSdk = 36
    ndkVersion = "30.0.16248370"

    defaultConfig {
        applicationId = "org.drumfake.app"
        minSdk = 26  // AAudio.
        targetSdk = 36
        versionCode = 1
        versionName = "0.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Signed with the debug key so that it installs as is.
            signingConfig = signingConfigs.debug
        }
    }

    // The native code is the regular desktop CMake project.
    externalNativeBuild {
        cmake {
            path = file('../../CMakeLists.txt')
            version = '4.1.2'
        }
    }

    // SDL's Java glue comes straight from the SDL submodule.
    sourceSets {
        main {
            java.srcDir '../../third_party/SDL/android-project/app/src/main/java'
        }
    }

    lint {
        abortOnError = false
    }
}
