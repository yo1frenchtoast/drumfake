<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Drumf(re)ake</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #171719;
    color: #c8d8d4;
    font: 16px system-ui, sans-serif;
  }
  canvas {
    display: block;
    /* Fingers go to the faceplate, not to page scrolling or zooming. */
    touch-action: none;
    outline: none;
  }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading Drumf(re)ake…</div>
<script>
  var canvas = document.getElementById("canvas");
  // Right click is a faceplate gesture (it locks Shift, Last Step…).
  canvas.addEventListener("contextmenu", function(event) { event.preventDefault(); });
  var Module = {
    canvas: canvas,
    setStatus: function(text) {
      var status = document.getElementById("status");
      if (status) {
        status.textContent = text;
      }
    },
    onRuntimeInitialized: function() {
      var status = document.getElementById("status");
      if (status) {
        status.remove();
      }
      canvas.focus();
    },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
