# Builds the web version and publishes it on GitHub Pages.
# Repository settings: Pages > Source: GitHub Actions.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Build
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j
      - name: Test
        run: node build-web/drumfake_tests.js
      - name: Assemble the site
        run: |
          mkdir site
          cp build-web/drumfake.html site/index.html
          cp build-web/drumfake.js build-web/drumfake.wasm build-web/drumfake.data site/
          # Versioned URLs: the browser fetches a new build at once instead of
          # keeping the old one in its cache (the page passes the version on to
          # the .wasm and the .data).
          sed -E -i "s/(src=\"?)drumfake\.js/\1drumfake.js?v=${GITHUB_SHA::8}/" site/index.html
          grep -q "drumfake.js?v=${GITHUB_SHA::8}" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
